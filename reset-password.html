<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f5ee">
    <title>Reset Password | Shruthi's Couture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="admin.css">
    <script type="module" src="reset-password-entry.mjs"></script>
  </head>
  <body>
    <header class="admin-header">
      <a class="admin-brand" href="index.html">
        <span class="admin-brand-name">SHRUTHI'S COUTURE</span>
        <span class="admin-brand-subtitle">OWNER ADMIN</span>
      </a>
      <a class="back-to-store" href="index.html">View storefront</a>
    </header>

    <main class="admin-main">
      <section class="admin-login-card" aria-labelledby="password-reset-title">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1 id="password-reset-title">Choose a new password</h1>
        <p class="admin-login-description">
          Enter and confirm a new password for your Shruthi Couture Admin Panel account.
        </p>
        <p
          class="password-reset-message"
          id="password-reset-message"
          role="status"
          aria-live="polite"
        ></p>
        <form class="editor-form" id="password-reset-form" hidden>
          <label>
            New password
            <input
              id="password-reset-new"
              name="new-password"
              type="password"
              autocomplete="new-password"
              required
              minlength="6"
            >
          </label>
          <label>
            Confirm new password
            <input
              id="password-reset-confirm"
              name="confirm-password"
              type="password"
              autocomplete="new-password"
              required
              minlength="6"
            >
          </label>
          <button class="primary-button" id="password-reset-submit" type="submit">
            Update password
          </button>
        </form>
        <a class="admin-footer-link" href="admin.html">Return to Admin Panel</a>
      </section>
    </main>
  </body>
</html>
